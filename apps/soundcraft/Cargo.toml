[package]
name = "soundcraft"
description = "SoundCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "soundcraft"

[lints]
workspace = true

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
soundcraft-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
